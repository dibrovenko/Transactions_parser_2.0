services:
  app:
    build:
      context: ./app
    container_name: python_app
    volumes:
      - ./app:/app  # Локальная папка монтируется внутрь контейнера
    depends_on:
      db_auth:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - ./.env  # Указываем .env файл здесь

  db_auth:
    extends:
      file: db/docker-compose.db.yml
      service: db_auth
